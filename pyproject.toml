[project]
name = "cmdkit"
version = "2.8.0"
description = "A command-line utility toolkit for Python."
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Geoffrey Lentner", email = "glentner@purdue.edu" },
]
keywords = ["command-line", "utility", "toolkit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.9,<4.0"
dependencies = []

[project.optional-dependencies]
toml = ["tomli>=2.1.0,<3.0.0", "tomli-w>=1.1.0,<2.0.0"]
yaml = ["pyyaml>=6.0.1,<7.0.0"]

[project.urls]
Homepage = "https://cmdkit.readthedocs.io"
Documentation = "https://cmdkit.readthedocs.io"
Repository = "https://github.com/glentner/cmdkit"

[dependency-groups]
dev = [
    "tomli>=2.1.0,<3.0.0",
    "tomli-w>=1.1.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pytest>=7.4.4,<8.0.0",
    "hypothesis>=6.92.6,<7.0.0",
    "sphinx-autobuild>=2021.3.14,<2022.0.0",
]
docs = [
    "sphinx>=7.2.6,<8.0.0",
    "sphinx-sitemap>=2.5.1,<3.0.0",
    "sphinx-autobuild>=2021.3.14,<2022.0.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinxext-opengraph>=0.9.1,<0.10.0",
    "sphinxcontrib-details-directive>=0.1.0,<0.2.0",
    "sphinx-toolbox>=3.5.0,<5.0.0",
    "pydata-sphinx-theme>=0.15.1,<0.16.0",
    "enum-tools[sphinx]>=0.10.0,<0.14.0",
    "docutils>=0.21.1,<0.22.0",
    # sphinxcontrib-details-directive imports pkg_resources, which setuptools 82 removed;
    # a uv environment holds only what is declared, so setuptools is named here
    "setuptools<82",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--strict-markers", ]
markers = [
    "unit: Unit tests are short, interface driven tests on discrete components.",
    "integration: Integration tests are often longer and deal with the interaction between systems.",
    "parameterize: Place holder for parameterized tests (not a real type).",
]
